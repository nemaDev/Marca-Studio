name: Build Marca Studio for macOS

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-macos.yml"
      - "electron/**"
      - "index.html"
      - "package-lock.json"
      - "package.json"
      - "scripts/**"
      - "src/**"
      - "vite.config.js"

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build universal macOS installer
        run: npm run dist

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: marca-studio-macos-universal
          path: release/*.dmg
          if-no-files-found: error
